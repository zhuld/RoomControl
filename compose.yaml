services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roomcontrol
      POSTGRES_USER: roomcontrol
      POSTGRES_PASSWORD: ${ROOMCONTROL_DB_PASSWORD:?Set ROOMCONTROL_DB_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - roomcontrol-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomcontrol -d roomcontrol"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  roomcontrol-postgres:
